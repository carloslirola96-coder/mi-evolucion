<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MI EVOLUCIÓN - Fitness, Hipertrofia y Nutrición IA</title>
  
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">

  <!-- Tailwind CSS Engine -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen flex flex-col justify-between selection:bg-[var(--primary)] selection:text-white">

  <!-- Contenedor Principal de la App (Ancho móvil óptimo) -->
  <div class="w-full max-w-md mx-auto flex-1 flex flex-col px-4 pt-3">
    <main id="main-content" class="flex-1 tab-enter">
      <!-- Las vistas se renderizan dinámicamente aquí -->
    </main>
  </div>

  <!-- Barra de Navegación Inferior Móvil Fija (6 secciones de la arquitectura) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[var(--card)]/95 backdrop-blur-md border-t border-[var(--card-border)] py-1.5 px-2 z-30">
    <div class="max-w-md mx-auto grid grid-cols-6 items-center text-center">
      
      <!-- 1. Inicio -->
      <button onclick="MainApp.switchTab('inicio')" data-tab="inicio" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--primary)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px] font-semibold">Inicio</span>
      </button>

      <!-- 2. Entrenar -->
      <button onclick="MainApp.switchTab('entrenar')" data-tab="entrenar" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--muted-foreground)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        <span class="text-[10px] font-semibold">Entrenar</span>
      </button>

      <!-- 3. Nutrición -->
      <button onclick="MainApp.switchTab('nutricion')" data-tab="nutricion" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--muted-foreground)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <span class="text-[10px] font-semibold">Nutrición</span>
      </button>

      <!-- 4. Evolución -->
      <button onclick="MainApp.switchTab('evolucion')" data-tab="evolucion" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--muted-foreground)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span class="text-[10px] font-semibold">Evolución</span>
      </button>

      <!-- 5. Entrenador IA -->
      <button onclick="MainApp.switchTab('entrenador')" data-tab="entrenador" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--muted-foreground)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <span class="text-[10px] font-semibold">Coach IA</span>
      </button>

      <!-- 6. Perfil -->
      <button onclick="MainApp.switchTab('perfil')" data-tab="perfil" class="nav-tab-btn flex flex-col items-center py-1 transition text-[var(--muted-foreground)]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px] font-semibold">Perfil</span>
      </button>
    </div>
  </nav>

  <!-- Contenedor Modal de Pantalla Completa para Entrenamiento en Directo -->
  <div id="live-workout-container" class="hidden"></div>

  <!-- Contenedor de Modales Globales (Foto comida, medidas, ajustes) -->
  <div id="global-modal"></div>

  <!-- Lógica y Módulos -->
  <script src="js/store.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/ai_coach.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('ServiceWorker registrado:', reg.scope);
        }).catch((err) => {
          console.warn('ServiceWorker registro omitido:', err);
        });
      });
    }
  </script>
</body>
</html>
